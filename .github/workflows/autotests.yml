name: Automated tests
on:
  push:
    paths-ignore: [".github/workflows/benchmarks.yml", "misc-scripts/**", "tests/gen_avc.py", ".gitignore", "CMakeLists.txt", "LICENSE_BSD.txt", "README.md"]
      
jobs:
  x86_64-apple-darwinXX:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: make CFLAGS="-march=x86-64" VARIANTS=x86-64-v2,x86-64-v3,x86-64-v4,logs check
  arm64-apple-darwinXX:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: make check
  x86_64-linux-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make CFLAGS="-march=x86-64" VARIANTS=x86-64-v2,x86-64-v3,x86-64-v4,logs check
      - run: make clean && cmake -S tests/cmake -B build-cmake && cmake --build build-cmake && ./build-cmake/consumer
      - run: make clean && make STATIC=yes BUILDTEST=no CFLAGS="-march=x86-64 -fPIC" && cc -shared -I. tests/static_plugin.c libedge264mvc.a -o static_plugin.so && ! nm -D --defined-only static_plugin.so | grep edge264mvc_
  arm64-linux-gnu:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: make check
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
      - uses: mymindstorm/setup-emsdk@v14
      - run: emmake make check
  # The library as Oku3D ships it on Windows (MinGW, static runtime, portable
  # baseline with x86-64-v2/v3 dispatch, assertions compiled out), decoded by
  # the portable harnesses. Without fork() the harnesses decode in-process, so
  # the job's time limit is the guard against a hang.
  x86_64-windows-mingw:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - run: make OS=windows CFLAGS=-march=x86-64 CPPFLAGS=-DNDEBUG VARIANTS=x86-64-v2,x86-64-v3,x86-64-v4,logs BUILDTEST=no conformance_check.exe liveness_check.exe asan_check.exe api_check.exe
      - run: ./conformance_check.exe run tests/conformance/manifest.txt tests/conformance
      - run: EDGE264MVC_THREADS=8 ./conformance_check.exe run tests/conformance/manifest.txt tests/conformance
      - run: EDGE264MVC_THREADS=8 ./liveness_check.exe run tests/liveness/manifest.txt tests/liveness
      - run: ./asan_check.exe run tests/asan/manifest.txt tests/asan
      - run: EDGE264MVC_THREADS=4 ./asan_check.exe run tests/asan/manifest.txt tests/asan
      - run: ./api_check.exe tests/conformance/mvc/MVCDS-5.264 tests/conformance/2d-synthetic/crop_top_left.264 tests/crop-margin.264 tests/conformance/2d/CABA3_Sony_C.264
      - run: make OS=windows clean && make OS=windows CFLAGS=-march=x86-64 STATIC=yes BUILDTEST=no && gcc -shared -I. tests/static_plugin.c libedge264mvc.a -static -pthread -o static_plugin.dll && ! objdump -p static_plugin.dll | grep edge264mvc_
  # AddressSanitizer + UndefinedBehaviorSanitizer over the whole test suite,
  # then ThreadSanitizer over the multithreaded passes. setarch -R: the
  # sanitizers' shadow memory does not fit the runner's ASLR layout otherwise.
  x86_64-linux-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: setarch -R make CC=clang SANITIZE=address,undefined check
      - run: setarch -R make CC=clang SANITIZE=address,undefined check-asan
      # GCC's UndefinedBehaviorSanitizer too, which unlike clang's checks the
      # vector lanes for signed overflow (the Makefile defines it with -fwrapv)
      - run: make clean && setarch -R make CC=gcc SANITIZE=undefined check
      # the API of a library built without the logs variant, as released
      - run: make clean && make VARIANTS= check-api
      # the SSE2 code of the x86-64 baseline object, which -march=native skips
      - run: make clean && make CC=clang SANITIZE=undefined CFLAGS=-march=x86-64 check-conformance
      - run: make clean
      - run: make CC=clang SANITIZE=thread CFLAGS="-march=x86-64 -g" BUILDTEST=no conformance_check liveness_check asan_check multi_decoder_check slice_overrun_check open_failure_check
      - run: EDGE264MVC_THREADS=8 setarch -R ./conformance_check run tests/conformance/manifest.txt tests/conformance
      # the header trace written from the worker threads
      - run: EDGE264MVC_TRACE=1 EDGE264MVC_THREADS=8 setarch -R ./conformance_check run tests/conformance/manifest.txt tests/conformance
      - run: EDGE264MVC_THREADS=8 setarch -R ./liveness_check run tests/liveness/manifest.txt tests/liveness
      - run: EDGE264MVC_THREADS=4 setarch -R ./asan_check run tests/asan/manifest.txt tests/asan
      - run: setarch -R ./multi_decoder_check tests/conformance/mvc/MVCDS-5.264 9 tests/conformance/2d/CABA3_Sony_C.264 300
      - run: setarch -R ./slice_overrun_check tests/conformance/2d-synthetic/overrun_reference.264 8 300 20
      # inter prediction at the right picture edge against the deblocking of its reference
      - run: TSAN_OPTIONS=halt_on_error=1 setarch -R ./slice_overrun_check tests/conformance/2d/cabac_mot_frm0_full.264 2 0 20
      - run: setarch -R ./open_failure_check
      # intra 8x8 prediction next to the slice another worker decodes
      - run: TSAN_OPTIONS=halt_on_error=1 setarch -R ./slice_overrun_check tests/conformance/2d-synthetic/intra8x8_hd_slices.264 8 0 10
  # A short libFuzzer run seeded with the committed streams, so a change that
  # breaks the decoder on damaged input shows up before a long campaign would.
  x86_64-linux-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: make fuzz
      # a decoder that cannot be opened must stop the fuzzer, not let it test nothing
      - run: if EDGE264MVC_FUZZ_THREADS=-1 setarch -R ./fuzz_decode tests/conformance/2d/CABA3_Sony_C.264; then exit 1; fi
      # a hang never ends, while a valid worst case (a damaged stream whose CABAC
      # bins stay cheap in bits, decoding every macroblock at full cost) takes
      # over 10 seconds under the sanitizers and coverage on these runners
      - run: mkdir -p corpus && setarch -R ./fuzz_decode -max_total_time=300 -max_len=262144 -timeout=30 -rss_limit_mb=4096 corpus tests/asan tests/liveness tests/conformance/2d tests/conformance/2d-synthetic tests/conformance/mvc
      # keep the input that failed, so the finding can be reproduced
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
